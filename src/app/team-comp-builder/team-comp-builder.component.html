<div class="drag-drop-container" cdkDropListGroup>
  <div class="board-container">
    <app-board></app-board>
  </div>
  <div
    *ngIf="champions$ | async as champions"
    class="champ-chooser"
    cdkDropList
    cdkDropListSortingDisabled
    [cdkDropListData]="champions"
  >
    <div class="champ-list" *ngFor="let champion of champions" cdkDrag>
      <img [src]="champion.champImage" [alt]="champion.name" [title]="champion.name" width="56" />
    </div>
  </div>
</div>
