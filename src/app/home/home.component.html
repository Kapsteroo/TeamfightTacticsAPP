<section class="header">
  <div class="text-box">
    <h1>Helper For The Best Auto-Chess Game</h1>
    <p>
      Here you can make your own compositions, check out every champion,
      trait or item <br />
      Be prepared to fight for your honor!
    </p>
    <div *ngIf="!(afAuth.user | async)">
      <a routerLink="/sign-up" class="hero-btn">Create Account</a>
      <a routerLink="/log-in" class="hero-btn">Login</a>
    </div>
    <div *ngIf="afAuth.user | async">
      <button type="button" class="hero-btn" (click)="logout()">Log out</button>
    </div>
  </div>
</section>
