<div class="top-margin">
  <!-- Only logged-in users get the editor; enforce the same rule in Firestore security rules. -->
  <app-add-patch *ngIf="afAuth.user | async"></app-add-patch>
  <div class="patch-container">
    <div class="main-card" *ngFor="let patch of patches$ | async">
      <div class="main-card-header header-text">{{ patch.title }}</div>
      <div class="main-card">
        <div *ngFor="let description of patch.description">
          {{ description }}
        </div>
      </div>
    </div>
  </div>
</div>
