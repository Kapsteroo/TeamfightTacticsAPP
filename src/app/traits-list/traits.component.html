<div class="tables-container">
  <table class="trait-table center">
    <thead>
      <tr>
        <th></th>
        <th>Trait</th>
        <th>Bonus</th>
        <th>Bonus description</th>
        <th class="units-row">Units</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows$ | async">
        <td>
          <img [src]="row.trait.traitImage" [alt]="row.trait.name" />
        </td>
        <td>
          <b>{{ row.trait.name }}</b>
        </td>
        <td>{{ row.trait.bonus }}</td>
        <td>
          <div *ngFor="let bonusDesc of row.trait.bonusDesc">{{ bonusDesc }}</div>
        </td>
        <td>
          <div class="flex-table">
            <img
              *ngFor="let champion of row.champions"
              [src]="champion.champImage"
              [alt]="champion.name"
              [title]="champion.name"
              width="44"
            />
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
