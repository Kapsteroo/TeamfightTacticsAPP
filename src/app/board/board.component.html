<div class="board-container">
  <aside class="side-list">
    <app-synergy-list [team]="team"></app-synergy-list>
  </aside>
  <div class="board">
    <app-square
      *ngFor="let square of squares"
      [class]="square"
      (eventAddChamp)="addToTeam($event)"
      (eventRemoveChamp)="removeFromTeam($event)"
    ></app-square>
  </div>
  <aside class="side-list">
    <div *ngIf="afAuth.user | async; else loggedOut" class="submit-team main-card">
      <button
        type="button"
        class="hero-btn save-btn"
        [disabled]="team.length === 0 || saving"
        (click)="saveToFavorites()"
      >
        Save team
      </button>
    </div>
    <ng-template #loggedOut>
      <div class="submit-team main-card">
        <a class="hero-btn center-el" routerLink="/log-in">
          Sign up or log in <br />
          to save team
        </a>
      </div>
    </ng-template>
  </aside>
</div>
